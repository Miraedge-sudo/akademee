server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # SPA entry — always revalidate so new deployments propagate instantly
    # (the JS/CSS assets are content-hashed, so only this tiny file refreshes).
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # API — tenant-scoped responses must NEVER be cached by a shared CDN edge.
    # The browser + Service Worker + react-query handle client caching instead.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
    }

    location /api-docs {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        proxy_pass http://backend:5000;
    }

    location / {
        # $uri/index.html is tried before $uri/ so a prerendered route (e.g.
        # dist/login/index.html, from the build's prerender step) is served
        # directly for the extension-less path — matching it as a directory
        # via $uri/ instead makes nginx 301-redirect to add a trailing slash
        # first, an extra hop crawlers/link-preview bots don't need.
        try_files $uri $uri/index.html $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Content-hashed build assets (Vite) — immutable: browsers & CDN edges
    # (Cloudflare) can cache these for a year without revalidating.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
        # Single Cache-Control header (max-age + immutable) so CDN edges and
        # browsers cache these content-hashed assets for a year.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary "Accept-Encoding" always;
    }
}
