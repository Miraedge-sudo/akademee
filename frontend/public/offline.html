<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#085041" />
  <title>Hors ligne — Akademee</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .container {
      text-align: center;
      max-width: 420px;
    }
    .icon-wrapper {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: #fef3c7;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
    }
    .icon {
      width: 40px;
      height: 40px;
      color: #d97706;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.875rem;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.625rem 1.5rem;
      background: #085041;
      color: #fff;
      font-size: 0.875rem;
      font-weight: 500;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }
    .btn:hover { background: #0a6b58; }
    .btn:active { transform: scale(0.97); }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      margin-right: 0.5rem;
    }
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.375rem;
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 1rem;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0f172a; color: #e2e8f0; }
      h1 { color: #f1f5f9; }
      p { color: #94a3b8; }
      .icon-wrapper { background: #451a03; }
      .icon { color: #fbbf24; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-wrapper">
      <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="2" y1="2" x2="22" y2="22"/>
        <path d="M8.5 2.5A3.5 3.5 0 0 1 12 6v.5"/>
        <path d="M5 12V6.72"/>
        <path d="M14.5 14.5A3.5 3.5 0 0 1 12 18a3.5 3.5 0 0 1-2.5-1.05"/>
        <path d="M10.75 18v4"/>
        <path d="M13.25 18v4"/>
        <path d="M3.5 6.5A.5.5 0 0 0 3 7v7a.5.5 0 0 0 .5.5h2"/>
        <path d="M18.5 14.5A.5.5 0 0 1 19 14h2a.5.5 0 0 1 .5.5v7"/>
        <path d="M6.5 14.5v-4"/>
      </svg>
    </div>
    <div class="status-bar">
      <span class="status-dot"></span>
      Hors ligne
    </div>
    <h1>Connexion nécessaire</h1>
    <p>
      Vous êtes actuellement hors ligne. Certaines fonctionnalités d'Akademee
      nécessitent une connexion Internet. Réessayez une fois la connexion rétablie.
    </p>
    <button class="btn" onclick="window.location.reload()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"/>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
      Réessayer
    </button>
  </div>
</body>
</html>
